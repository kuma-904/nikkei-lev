name: update-data

# 日経の日足を取得して data/data.json を更新・コミットする。
# 平日の場中〜引け後に複数回まわす（cron は UTC。JST = UTC+9）。
on:
  schedule:
    # 平日 8:00〜20:00 JST を毎時更新（頻度アップ）。cron は UTC（JST = UTC+9）。
    # ※ 日足データのため日中は基本変わらない。引け後の当日データを早めに拾い、
    #    「時点/次回更新」表示を新鮮に保つのが狙い。変化がなければコミットしない。
    - cron: "0 23 * * 0-4"    # 08:00 JST（前夜の米国株・ドル円が反映＝オーバーナイト用）
    - cron: "0 0-11 * * 1-5"  # 09:00〜20:00 JST の毎時
  workflow_dispatch: {}   # 手動実行も可

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Update data
        run: python scripts/update_data.py --out data/data.json --pred-out data/predictions.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/data.json data/predictions.json
            git commit -m "chore: update data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "変更なし"
          fi
